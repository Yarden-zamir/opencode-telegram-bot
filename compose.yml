services:
  bot:
    build:
      context: .
    pull_policy: build
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      OPENCODE_API_URL: http://opencode:4096
      OPENCODE_SERVER_USERNAME: opencode
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?OPENCODE_SERVER_PASSWORD is required}
      OPENCODE_MODEL_PROVIDER: ${OPENCODE_MODEL_PROVIDER:?OPENCODE_MODEL_PROVIDER is required}
      OPENCODE_MODEL_ID: ${OPENCODE_MODEL_ID:?OPENCODE_MODEL_ID is required}
      OPENCODE_TELEGRAM_HOME: /data
      XDG_CONFIG_HOME: /data/.config
      XDG_STATE_HOME: /data/.local/state
      XDG_CACHE_HOME: /data/.cache
      STT_API_URL: ${STT_API_URL:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-}
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_PARAMS_FILE: ${KITSHN_PARAMS_FILE}
      KITSHN_DATA_DIR: ${KITSHN_DATA_DIR}
      KITSHN_LOG_DIR: ${KITSHN_LOG_DIR}
    volumes:
      - ${KITSHN_DATA_DIR}:/data
    networks:
      - kitshn-edge
    labels:
      kitshn.depends_on: "Yarden-zamir/opencode-serve"

networks:
  kitshn-edge:
    external: true
